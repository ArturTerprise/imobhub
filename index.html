      <h1>imobHUB — Plataforma de gestão imobiliária</h1>
      <p>
        O imobHUB é um ecossistema completo para imobiliárias e corretores: CRM,
        site profissional, portal de vendas e automações em uma única plataforma.
      </p>
      <h2>Integração com o Google Agenda</h2>
      <p>
        O imobHUB oferece uma integração opcional com o Google Agenda. Ao conectar
        sua conta Google, o app "imobhub-google-integrations" usa o escopo
        https://www.googleapis.com/auth/calendar.events para criar, atualizar e
        remover no seu Google Agenda os eventos dos agendamentos feitos no imobHUB
        (visitas a imóveis, reuniões e follow-ups), e o escopo
        https://www.googleapis.com/auth/userinfo.email apenas para identificar a
        conta Google conectada. A conexão é opcional (opt-in) e pode ser revogada a
        qualquer momento. O uso e a transferência de dados recebidos das Google APIs
        seguem a Política de Privacidade do imobHUB e a Google API Services User Data
        Policy, incluindo os requisitos de Uso Limitado.
      </p>
